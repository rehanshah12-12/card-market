<title>Card Market | Digital Tools Store</title>
<style>
:root{--blue:#073b65;--cyan:#08bfe8;--cyan2:#62e3ff;--ink:#102d43;--muted:#617789;--bg:#f4fbff;--white:#fff;--line:#dceef6;--shadow:0 14px 38px rgba(7,59,101,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,a{font:inherit}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.5px;color:var(--blue);font-size:1.08rem}.brand img{width:46px;height:46px;object-fit:cover;border-radius:13px;border:1px solid #d9f5ff}.brand-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--cyan),var(--blue));display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 6px 15px #08bfe833}.navlinks{display:flex;align-items:center;gap:27px;font-size:.94rem;font-weight:700}.navlinks a:hover{color:#009dc8}.nav-cta,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer;transition:.2s}.nav-cta,.btn-primary{background:var(--cyan);color:#063451;box-shadow:0 8px 20px #08bfe82b}.nav-cta:hover,.btn-primary:hover{transform:translateY(-2px);background:#35d4f5}.btn-secondary{background:white;color:var(--blue);border:1px solid #c7eaf5}.btn-secondary:hover{border-color:var(--cyan);transform:translateY(-2px)}.menu-toggle{display:none;background:white;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--blue);font-weight:800}
.hero{padding:62px 0 38px}.hero-card{position:relative;overflow:hidden;border-radius:30px;padding:clamp(28px,6vw,66px);background:radial-gradient(circle at 88% 18%,#26d4ff66,transparent 29%),linear-gradient(125deg,#073b65 0%,#0b5d89 55%,#08bfe8 120%);color:white;box-shadow:0 22px 55px #073b6526}.hero-card:before{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff26;border-radius:50%;right:-90px;bottom:-170px;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff06}.hero-content{position:relative;z-index:1;max-width:660px}.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#ffffff18;border:1px solid #ffffff35;padding:8px 12px;border-radius:999px;font-size:.82rem;font-weight:800;letter-spacing:.4px}.eyebrow i{width:8px;height:8px;background:#6bf0ff;border-radius:50%;box-shadow:0 0 12px #6bf0ff}.hero h1{font-size:clamp(2.2rem,5.4vw,4.25rem);line-height:1.04;letter-spacing:-1.8px;margin:22px 0 16px}.hero h1 span{color:#8cf0ff}.hero p{font-size:clamp(1rem,2vw,1.13rem);line-height:1.7;color:#e3f8ff;max-width:560px;margin:0 0 26px}.hero-actions{display:flex;flex-wrap:wrap;gap:12px}.hero .btn-secondary{background:#ffffff12;color:white;border-color:#ffffff55}.hero .btn-secondary:hover{background:#ffffff22}.trust-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:27px;color:#e1f8ff;font-size:.86rem;font-weight:650}.trust-row span{display:flex;align-items:center;gap:7px}.check{color:#85f5ff;font-weight:900}
.section{padding:34px 0 60px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.section-kicker{font-size:.78rem;font-weight:900;letter-spacing:1.6px;color:#009fc9;text-transform:uppercase}.section h2{font-size:clamp(1.7rem,3vw,2.35rem);letter-spacing:-.7px;margin:8px 0 0;color:var(--blue)}.section-head p{margin:8px 0 0;color:var(--muted);line-height:1.6}.search-wrap{position:relative;width:min(340px,100%)}.search-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7193a7;font-size:20px}.search{width:100%;padding:14px 14px 14px 43px;border:1px solid #d6eaf3;background:white;border-radius:14px;outline:none;color:var(--ink)}.search:focus{border-color:var(--cyan);box-shadow:0 0 0 4px #08bfe81b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tool-card{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 6px 20px #073b6508;transition:transform .2s,box-shadow .2s}.tool-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.tool-art{height:145px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#e9fbff,#b9f1ff 55%,#dff8ff)}.tool-art:before,.detail-art:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;border:1px solid #ffffffa8;box-shadow:0 0 0 22px #ffffff40,0 0 0 45px #ffffff25}.tool-art:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:#fff7;filter:blur(2px)}.tool-icon{position:relative;z-index:1;width:74px;height:74px;border-radius:23px;background:#fff;box-shadow:0 12px 28px #073b6520;display:grid;place-items:center;font-size:36px;font-weight:900;color:var(--blue);border:1px solid #ffffff}.tool-icon img{width:100%;height:100%;object-fit:cover;border-radius:22px}.tool-icon .capcut{font-size:25px;color:#111}.tool-icon .canva{font-family:Georgia,serif;font-style:italic;color:#13b7d5;font-size:42px}.tool-icon .gemini{background:linear-gradient(130deg,#4285f4,#9b72cb,#d96570,#f9ab00);color:transparent;background-clip:text;font-size:45px}.tool-icon .flow{font-size:24px;color:#1676d2}.tool-icon .muse{font-size:20px;color:#8054e8}.tool-label{position:absolute;left:15px;top:14px;background:#ffffffc9;color:#15506d;border:1px solid #ffffff;padding:6px 9px;border-radius:999px;font-size:.72rem;font-weight:850;z-index:2}.tool-body{padding:20px}.tool-title-row{display:flex;align-items:start;justify-content:space-between;gap:8px}.tool-title-row h3{margin:0;color:var(--blue);font-size:1.15rem}.price{font-weight:900;color:#008bb2;white-space:nowrap}.tool-body p{color:var(--muted);line-height:1.55;font-size:.9rem;min-height:43px;margin:11px 0 18px}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card-actions .btn{padding:11px 8px;font-size:.87rem}.empty{grid-column:1/-1;background:white;border:1px dashed #b9dce9;padding:28px;border-radius:18px;text-align:center;color:var(--muted)}
.benefits{padding:5px 0 65px}.benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.benefit{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.benefit-icon{height:43px;width:43px;display:grid;place-items:center;background:#e4faff;border-radius:13px;font-size:21px}.benefit h3{margin:13px 0 7px;color:var(--blue);font-size:1rem}.benefit p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.6}
.contact{padding:0 0 65px}.contact-card{background:linear-gradient(120deg,#e3faff,#fff);border:1px solid #cceef8;border-radius:26px;padding:clamp(24px,4vw,42px);display:flex;align-items:center;justify-content:space-between;gap:25px}.contact-card h2{margin:8px 0;color:var(--blue);font-size:clamp(1.6rem,3vw,2.2rem)}.contact-card p{margin:0;color:var(--muted);line-height:1.6;max-width:580px}.contact-actions{display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0}.payment-note{margin-top:17px;color:var(--muted);font-size:.9rem;line-height:1.6}.payment-note strong{color:var(--blue)}
footer{background:#062d4c;color:#d9f4ff;padding:28px 0}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:18px}.footer-brand{font-weight:900;letter-spacing:.5px}.footer-small{font-size:.83rem;color:#a9d6e8;margin-top:5px}.footer-links{display:flex;gap:18px;font-size:.9rem}.footer-links a:hover{color:white}

@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{align-items:stretch;flex-direction:column}.search-wrap{width:100%}.contact-card{align-items:flex-start;flex-direction:column}.detail-panel{grid-template-columns:1fr}.detail-art{min-height:210px}.detail-copy{padding:24px}.navlinks{gap:16px}}
@media(max-width:560px){.wrap{width:min(100% - 24px,1120px)}.nav{height:66px}.brand{font-size:.96rem}.brand img{width:39px;height:39px}.brand-mark{width:39px;height:39px}.menu-toggle{display:block}.navlinks{display:none;position:absolute;top:65px;left:12px;right:12px;background:white;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);flex-direction:column;align-items:stretch;gap:0}.navlinks.open{display:flex}.navlinks a{padding:12px 8px}.nav-cta{display:none}.hero{padding-top:25px}.hero-card{border-radius:23px;padding:28px 22px}.hero h1{letter-spacing:-1px}.hero-actions .btn{flex:1}.trust-row{gap:12px}.section{padding-bottom:45px}.grid{grid-template-columns:1fr;gap:14px}.tool-art{height:132px}.tool-body p{min-height:0}.benefit-grid{grid-template-columns:1fr}.contact-actions{width:100%}.contact-actions .btn{flex:1}.footer-inner{align-items:flex-start;flex-direction:column}.footer-links{flex-wrap:wrap}.detail-art{min-height:170px}.detail-wrap{margin-top:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
